<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>

        <!-- Add todo form -->
        <form id="add-form" class="add-form">
            <input
                type="text"
                id="todo-input"
                placeholder="What needs to be done?"
                autocomplete="off"
                required
            >
            <button type="submit" id="add-btn">Add</button>
        </form>

        <!-- Filter tabs -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Todo list -->
        <ul id="todo-list" class="todo-list"></ul>

        <!-- Summary -->
        <div class="summary" id="summary"></div>

        <!-- Settings section -->
        <details class="settings-section" id="settings-section">
            <summary class="settings-toggle">⚙️ Google Sheets Settings</summary>
            <form id="settings-form" class="settings-form">
                <div class="form-group">
                    <label for="spreadsheet-id">Spreadsheet ID</label>
                    <input type="text" id="spreadsheet-id" placeholder="Google Spreadsheet ID" />
                </div>
                <div class="form-group">
                    <label for="service-account-file">Service Account Key Path</label>
                    <input type="text" id="service-account-file" placeholder="/path/to/service-account-key.json" />
                </div>
                <button type="submit" id="save-settings-btn" class="save-settings-btn">Save Settings</button>
                <div class="settings-msg" id="settings-msg"></div>
            </form>
        </details>

        <!-- Error message -->
        <div class="error-msg" id="error-msg"></div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
